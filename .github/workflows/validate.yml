name: Validate HACS Seasonal Fun Card
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save playwright
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install chromium
      - name: JavaScript syntax
        run: |
          node --check dist/frankys-christmas-card.js
          node --check dist/legacy-christmas-engine.js
          node --check dist/frankys-seasonal-card.js
          node --check dist/seasonal-scenes.mjs
          node --check dist/marshmallow-engine.js
          node --check dist/vendor/GLTFLoader.js
          node --check dist/vendor/BufferGeometryUtils.js
          node tests/audio.test.cjs
          node tests/editor.test.cjs
          node tests/global-scheduler.test.cjs
          node tests/ha-test-installation.test.cjs
          node tests/seasonal-fun.test.cjs
          node tests/figure-selection.test.cjs
          node tests/hide-mode.test.cjs
          node tests/safari-alpha.test.cjs
          node tests/cache-busting.test.cjs
          node tests/seasonal-calendar.test.cjs
          node tests/audio-browser.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
      - name: Ensure Christmas media and licenses remain available
        run: |
          test -s dist/assets/christkind_lipsync_safari.webp
          test -s dist/assets/christkind_lipsync_safari.mp3
          test -s dist/sleigh.webm
          test -s dist/sleigh-ipad.webp
          test -s dist/santa.mp3
          test -s dist/bells.mp3
          test -s assets/preview.jpg
          grep -F '![Franky' README.md
          test -s ASSET_LICENSE.md
          test -s THIRD_PARTY_LICENSES.md
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          # The HACS image checker sometimes reads the previous published release
          # instead of this release candidate; README image is verified above.
          ignore: images

  publish_v054:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish v0.5.4]')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v0.5.4 on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.5.4 >/dev/null 2>&1; then
            echo 'Release v0.5.4 already exists.'
            exit 0
          fi
          printf '%s\n' \
            'New display modes: Normal, Compact and Hidden.' \
            'In Hidden mode, automatic animations and sound continue; the card takes no dashboard space.' \
            'Manual season choice overrides the automatic calendar for the current day.' \
            > /tmp/frankys-v054-release-notes.txt
          gh release create v0.5.4 --target "$GITHUB_SHA" --title "Franky's Seasonal Fun Card v0.5.4" --notes-file /tmp/frankys-v054-release-notes.txt --latest
