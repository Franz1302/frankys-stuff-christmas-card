name: Publish v0.4.2 (Franky's Seasonal Fun Card)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v042.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save playwright
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install chromium
      - name: Validate JavaScript, compatibility and season calendar
        run: |
          node --check dist/frankys-christmas-card.js
          node --check dist/legacy-christmas-engine.js
          node --check dist/frankys-seasonal-card.js
          node --check dist/seasonal-scenes.mjs
          node --check dist/marshmallow-engine.js
          node tests/audio.test.cjs
          node tests/editor.test.cjs
          node tests/global-scheduler.test.cjs
          node tests/ha-test-installation.test.cjs
          node tests/seasonal-fun.test.cjs
          node tests/cache-busting.test.cjs
          node tests/seasonal-calendar.test.cjs
          node tests/audio-browser.test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
      - name: Verify bundled media and attribution
        run: |
          test -s dist/sleigh.webm
          test -s dist/sleigh-ipad.webp
          test -s dist/santa.mp3
          test -s dist/bells.mp3
          test -s dist/assets/St_Martin_korrigiert.webp
          test -s dist/assets/St_Martin_Mirelo_Ton_9s.mp3
          test -s dist/assets/Nikolaus_ohne_Wasserzeichen_transparent.webp
          test -s dist/assets/Nikolaus_Mirelo_Ton_15s.mp3
          test -s dist/assets/marshmallow-animated.glb
          test -s dist/vendor/THREE_LICENSE.txt
          test -s assets/preview.jpg
          grep -F 'Mirelo AI' README.md
          grep -F 'Mirelo AI' SEASONAL_ASSET_SOURCES.md
          grep -F 'v0.4.2' RELEASE_NOTES_V042.md
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          ignore: images
      - name: Publish v0.4.2 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.2 >/dev/null 2>&1; then
            echo "v0.4.2 already published; skipping."
            exit 0
          fi
          gh release create v0.4.2 \
            --target "$GITHUB_SHA" \
            --title "Franky's Seasonal Fun Card v0.4.2" \
            --notes-file RELEASE_NOTES_V042.md \
            --latest
