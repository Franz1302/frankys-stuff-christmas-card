name: Publish v0.2.3 (quiet hours)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v023.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and bundled media
        run: |
          node --check dist/frankys-christmas-card.js
          test -s dist/sleigh.webm
          test -s dist/sleigh-ipad.webp
          test -s dist/santa.mp3
          test -s dist/bells.mp3
          test -s assets/preview.jpg
      - name: Validate HACS
        uses: hacs/action@main
        with:
          category: plugin
      - name: Publish v0.2.3 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo "Release already published."
            exit 0
          fi
          gh release create v0.2.3 \
            --target "$GITHUB_SHA" \
            --title "Franky's Christmas Card v0.2.3" \
            --notes-file RELEASE_NOTES_V023.md \
            --latest
